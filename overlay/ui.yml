#
# Files listed here are published to the site root.
#
# The Netlify control files (_redirects, _headers) MUST be at the
# publish root to take effect. robots.txt and favicon.ico are
# conventionally served from the root too.
#

static_files:
- _redirects
- _headers
- robots.txt
- favicon.ico
- feeds/rss.xml
- feeds/atom.xml
- feeds/feed.json
