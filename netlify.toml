#
# Netlify build configuration.
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The site is built with Antora into public/. The Netlify control files
# (_redirects, _headers) are emitted into public/ from the Antora overlay
# (see overlay/ui.yml), so Netlify picks them up automatically — they are not
# duplicated here.
#

[build]
  # Builds with site-ci.yml (npm run build:ci): it reads the repo's committed
  # HEAD (Netlify does a normal clone, not the local git worktree that
  # site-dev.yml works around) and pins the published website-ui theme bundle.
  # site.url is kieranpotts.com; on branch/deploy previews that only affects
  # absolute links and the sitemap, which do not matter on previews.
  command = "npm run build:ci"
  publish = "public"

[build.environment]
  # Match the Node version pinned in .nvmrc.
  NODE_VERSION = "22.13.0"
