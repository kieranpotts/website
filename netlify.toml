#
# Netlify build configuration.
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# The site is built with Antora into public/. The Netlify control files
# (_redirects, _headers) are emitted into public/ from the src/static
# supplemental_files mount (see src/static/ui.yml), so Netlify picks them up
# automatically — they are not duplicated here.
#

[build]
  # Builds with site-ci.yml (npm run build:ci): it reads the repo's committed
  # HEAD (Netlify does a normal clone, not the local git worktree that
  # site-dev.yml works around). site.url is kieranpotts.com; on branch/deploy
  # previews that only affects absolute links and the sitemap, which do not
  # matter on previews.
  #
  # Builds triggered via the content-preview build hook (see
  # .github/workflows/netlify-content-preview.yaml) carry a JSON payload in
  # INCOMING_HOOK_BODY. Extract its thoughts_branch into THOUGHTS_BRANCH,
  # which site-ci.yml's content-preview extension uses to override the
  # thoughts content source's branch for that build only. Normal builds
  # (push/PR/manual) have no INCOMING_HOOK_BODY, so this is a no-op for them.
  command = '''
    if [ -n "$INCOMING_HOOK_BODY" ]; then
      export THOUGHTS_BRANCH=$(node -e "try{process.stdout.write(JSON.parse(process.env.INCOMING_HOOK_BODY).thoughts_branch||'')}catch(e){}")
    fi
    npm run build:ci
  '''
  publish = "public"

[build.environment]
  # Match the Node version pinned in .nvmrc.
  NODE_VERSION = "22.13.0"
