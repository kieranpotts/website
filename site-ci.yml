site:
  title: Kieran Potts
  url: https://kieranpotts.com
  start_page: ROOT::index.adoc

content:
  sources:
  - url: .
    branches: HEAD
    start_path: src

  # blog/garden/bookmarks are referenced by their (public) remote URL — they
  # are submodules and cannot be read as local sources. No token is needed
  # because the repositories are public.
  - url: 'https://github.com/kieranpotts/thoughts.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/thoughts/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/garden.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/garden/edit/dev/{path}'

  - url: 'https://github.com/kieranpotts/bookmarks.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/bookmarks/edit/dev/{path}'

ui:
  # The custom theme, published as a release asset of the website-ui repo and
  # pinned by version. Keep this in sync with site-dev.yml.
  bundle:
    url: https://github.com/kieranpotts/website-ui/releases/download/v0.0.0/ui-bundle.zip
    snapshot: true
  # The overlay supplies only the site's static control files (_redirects,
  # _headers, robots.txt, favicon.ico) and the blog feeds; the theme bakes in
  # all UI partials. See overlay/ui.yml.
  supplemental_files: overlay

output:
  clean: true
  dir: public
