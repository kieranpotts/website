#
# Check the published website for broken links. Runs on a schedule, after
# the nightly Netlify rebuild (see netlify-build.yaml), so it always tests
# the latest content rather than a stale deploy.
#
# On failure, opens or updates a single tracking issue rather than failing
# silently — see the "Open issue on failure" step.
#

name: Check Broken Links

on:
  schedule:
    # Runs daily at 03:00 UTC, one hour after the Netlify rebuild.
    - cron: '0 3 * * *'

  # Allows manual execution from the GitHub UI.
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-links:
    name: Check for broken links
    runs-on: ubuntu-latest

    steps:
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --config .github/lychee.toml
            https://kieranpotts.com/sitemap.xml
          format: markdown
          output: lychee-report.md
          fail: true

      - name: Open issue on failure
        if: failure() && steps.lychee.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('lychee-report.md', 'utf8');
            const title = 'Broken links found on kieranpotts.com';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ERRATA',
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ERRATA'],
              });
            }
