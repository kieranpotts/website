
#
# Config for the lychee link checker used by check-links.yaml.
# See https://lychee.cli.rs/usage/config/ for all options.
#
# lychee has no recursive-crawl mode (as of 2026, still unreleased —
# https://github.com/lycheeverse/lychee/issues/78), and it doesn't follow
# sitemap-index files either — it only reads <loc> entries as pages to
# check, so pointing it at the top-level sitemap.xml just checks the 4
# nested sitemap URLs rather than the pages inside them. So
# check-broken-links.yaml passes each of the 4 nested urlset sitemaps
# (sitemap-bookmarks.xml, sitemap-garden.xml, sitemap-ROOT.xml,
# sitemap-thoughts.xml) directly.
#

# Retry transient failures before reporting them as broken.
max_retries = 3
retry_wait_time = 5

# Some sites (eg. LinkedIn) block automated HEAD/GET requests from CI
# runners even though the link is fine for real visitors.
exclude = [
  "^mailto:",
  "^https://(www\\.)?linkedin\\.com",
]

# Accept these on top of 2xx, since some servers use them for pages that
# still exist but require auth or rate-limit crawlers.
accept = ["200..=299", "403", "429"]
