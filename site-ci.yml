site:
  title: Kieran Potts
  url: https://kieranpotts.com
  start_page: ROOT::index.adoc

content:
  sources:
  - url: .
    branches: HEAD
    start_path: src/content

  # blog/garden/bookmarks are referenced by their (public) remote URL — they
  # are submodules and cannot be read as local sources. No token is needed
  # because the repositories are public.
  #
  # thoughts' branch here is the default (latest/dev); the content-preview
  # extension (./src/lib/content-preview/extension.js) overrides it at build
  # time from THOUGHTS_BRANCH, when set, for one-off draft previews. See
  # .github/workflows/netlify-preview.yaml.
  - url: 'https://github.com/kieranpotts/thoughts.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/thoughts/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/garden.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/garden/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/bookmarks.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/bookmarks/edit/latest/dev/{path}'

antora:
  # Site-level extensions (NOT Asciidoctor extensions — see asciidoc.extensions
  # below). The feeds extension generates /feeds/{rss.xml,atom.xml,feed.json}
  # from the aggregated blog content at build time. See src/lib/feeds/.
  #
  # The content-preview extension overrides the thoughts content source's
  # branch from THOUGHTS_BRANCH, when set, for one-off draft previews. It is a
  # no-op on normal builds, where that var is unset. Only registered here —
  # not in site-dev.yml — since manual content previews are a CI/Netlify
  # concern, not a local-dev one.
  extensions:
  - ./src/lib/feeds/extension.js
  - ./src/lib/content-preview/extension.js

asciidoc:
  # Custom block-level HTML converters.
  #
  # The extension registers a custom html5 converter that emits clean semantic
  # HTML for a handful of block types (paragraph, lists, image, listing, quote,
  # section, preamble, sidebar) and delegates all other blocks to Antora's
  # built-in converter. See src/lib/asciidoc/.
  #
  # Keep in sync with site-dev.yml.
  extensions:
  - ./src/lib/asciidoc/extension.js

ui:
  # The custom theme is built in-repo from src/ui/ (see gulpfile.js). The site
  # build runs `npm run bundle:ui` first, emitting the unzipped UI into
  # src/ui/dist/, which Antora consumes directly as a local UI source. Keep this
  # in sync with site-dev.yml.
  bundle:
    # Resolved relative to this playbook (the project root).
    url: ./src/ui/dist
    snapshot: true
  # src/static supplies the site's static control files (_redirects, _headers,
  # robots.txt, favicon.ico) and the blog feeds. See src/static/ui.yml.
  supplemental_files: src/static

output:
  clean: true
  dir: public
