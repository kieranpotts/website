site:
  title: Kieran Potts
  url: http://localhost:8080
  start_page: ROOT::index.adoc

content:
  sources:
  # This repo is checked out as a git worktree, so its working-tree `.git` is a
  # pointer file, not a directory. Antora (via isomorphic-git) only recognises a
  # local source whose `.git` is a real directory, so it cannot read the
  # worktree directly. Instead we point at the sibling bare repo and its
  # `latest/dev` branch — the same mechanism used for the remote sources below.
  #
  # CONSEQUENCE: local builds reflect only *committed* content on `latest/dev`.
  # Uncommitted edits to the home/about pages under src/ will NOT appear until
  # they are committed. (The container mounts the parent dir so `../.bare` is
  # reachable inside it; see docker-compose.yml.)
  - url: ../.bare
    branches: latest/dev
    start_path: src/content

  # blog/garden/bookmarks are referenced by their (public) remote URL, even in
  # this dev playbook. The playbook reads the pushed branch, so changes in those
  # repos must be pushed before they appear here.
  #
  # WHY NOT LOCAL? Each lives in a sibling worktree checkout
  # (../../garden/.bare, etc.), so in principle we could point at those bare
  # repos the same way this playbook reads the website's own ../.bare — Antora
  # would then pick up local *committed* (unpushed) commits without a push.
  # We deliberately don't, because it does not pay for its complexity:
  #   * It would still only show committed content, not uncommitted working-tree
  #     edits — so it saves a push, not a commit. (Rendering uncommitted edits
  #     would need the throwaway-tmp-repo snapshot hack; more moving parts.)
  #   * The Docker workflow (./run/*) only bind-mounts the website/ directory, so
  #     ../../garden/.bare resolves OUTSIDE the mount and is invisible in the
  #     container. Supporting it would mean widening the bind mount to the whole
  #     dev root and reworking the run/ scripts — broadening the container's
  #     filesystem access for a marginal gain.
  # Net: keep these remote; push sub-repo changes to see them locally.
  - url: 'https://github.com/kieranpotts/thoughts.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/thoughts/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/standards.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/standards/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/garden.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/garden/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/bookmarks.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/bookmarks/edit/latest/dev/{path}'

antora:
  # Site-level extensions (NOT Asciidoctor extensions — see asciidoc.extensions
  # below). The feeds extension generates /feeds/{rss.xml,atom.xml,feed.json}
  # from the aggregated blog content at build time. See src/lib/feeds/.
  # Keep in sync with site-ci.yml.
  extensions:
  - ./src/lib/feeds/extension.js

asciidoc:
  # Custom block-level HTML converters.
  #
  # The extension registers a custom html5 converter that emits clean semantic
  # HTML for a handful of block types (paragraph, lists, image, listing, quote,
  # section, preamble, sidebar) and delegates all other blocks to Antora's
  # built-in converter. See src/lib/asciidoc/.
  #
  # Keep in sync with site-ci.yml.
  extensions:
  - ./src/lib/asciidoc/extension.js

ui:
  # The custom theme is built in-repo from src/ui/ (see gulpfile.js). The site
  # build runs `npm run bundle:ui` first, emitting the unzipped UI into
  # src/ui/dist/, which Antora consumes directly as a local UI source. Iterate on
  # the theme in isolation with `npm run preview:ui`.
  bundle:
    # Resolved relative to this playbook (the project root).
    url: ./src/ui/dist
    snapshot: true
  # src/static supplies the site's static control files (_redirects, _headers,
  # robots.txt, favicon.ico) and the blog feeds. See src/static/ui.yml.
  supplemental_files: src/static

output:
  clean: true
  dir: public
