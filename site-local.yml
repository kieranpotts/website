site:
  title: Kieran Potts
  url: http://localhost:8080
  start_page: ROOT::index.adoc

content:
  sources:
  # This repo is checked out as a git worktree, so its working-tree `.git` is a
  # pointer file, not a directory. Antora (via isomorphic-git) only recognises a
  # local source whose `.git` is a real directory, so it cannot read the
  # worktree directly. Instead we point at the sibling bare repo and its `dev`
  # branch — the same mechanism used for the remote sources below.
  #
  # CONSEQUENCE: local builds reflect only *committed* content on `dev`.
  # Uncommitted edits to the home/about pages under src/ will NOT appear until
  # they are committed. (The container mounts the parent dir so `../.bare` is
  # reachable inside it; see docker-compose.yml.)
  - url: ../.bare
    branches: dev
    start_path: src

  # blog/garden/bookmarks are submodules, so they cannot be read as local
  # content sources (Antora rejects a submodule .git pointer file). They are
  # referenced by their (public) remote URL instead. The playbook reads the
  # pushed branch, so changes in those repos must be pushed before they appear
  # here.
  - url: 'https://github.com/kieranpotts/thoughts.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/thoughts/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/garden.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/garden/edit/dev/{path}'

  - url: 'https://github.com/kieranpotts/bookmarks.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/bookmarks/edit/dev/{path}'

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: overlay

output:
  clean: true
  dir: public
