#
# Defines the container service for the website. The project source is
# bind-mounted into the container so edits on the host are reflected
# immediately, and node_modules is written into the bind-mounted directory so
# that it is owned by the host user and accessible from outside the container.
#
# This repository is checked out as a git *worktree*: the working tree's `.git`
# is a pointer file (`gitdir: …/website/.bare/worktrees/default`) and the git
# object store lives in the sibling `.bare/` directory. isomorphic-git (used by
# Antora) cannot read a worktree, so site-dev.yml's local content source points
# at the sibling bare repo (`url: ../.bare`). For that path to resolve inside
# the container, we mount the parent (the `website/` directory containing both
# `.bare/` and `default/`) at the SAME absolute path inside the container,
# rather than mounting just the working tree.
#
# WEBSITE_DIR is the absolute host path of that parent directory; the run/
# scripts export it. Use the scripts in ./run/ rather than invoking docker
# compose directly.
#

services:
  website:
    build: .
    volumes:
      - "${WEBSITE_DIR:?run via ./run/* scripts, which set WEBSITE_DIR}:${WEBSITE_DIR}"
    working_dir: "${WEBSITE_DIR}/default"
    ports:
      - "8080:8080"
