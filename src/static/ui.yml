#
# UI descriptor for the src/static supplemental_files mount.
#
# Paths listed under static_files are published to the site root (relative to
# this directory, which is the mount root — the src/static prefix is NOT part of
# the published path).
#
# This mount carries only true static files. The UI theme (partials, brand
# image, CSS/JS) is built in-repo from src/ui/ and consumed via the playbooks'
# ui.bundle, not layered in here.
#
# The Netlify control files (_redirects, _headers) MUST be at the publish root
# to take effect. robots.txt and favicon.ico are conventionally served from the
# root too.
#

static_files:
- _redirects
- _headers
- robots.txt
- favicon.ico
# The feed documents themselves (rss.xml, atom.xml, feed.json) are NOT static —
# they are generated from the aggregated blog content at build time by the feeds
# extension (see src/lib/feeds/ and antora.extensions in the playbooks).
#
# These XSLT stylesheets are the static browser presentation layer for the
# generated feeds: opening /feeds/rss.xml in a browser applies the matching .xsl
# (referenced from the feed's <?xml-stylesheet?> instruction) to render a
# readable HTML page.
- feeds/rss.xsl
- feeds/atom.xsl
