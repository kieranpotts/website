#
# Trigger a rebuild of the production website every night at 2am.
#
# Ensures new content from sub-repositories (blog, digital garden, etc.)
# are pulled in.
#
# To set up:
#
# 1. In Netlify. go to Site Settings → Build & Deploy → Build Hooks,
#    create a new build hook, and copy the generated URL.
# 2. In GitHub, go to Repository → Settings → Secrets and variables → Actions,
#    create a repository secret with name `NETLIFY_BUILD_HOOK` and the
#    URL as the value.
#

name: Netlify Build

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'

  # Allows manual execution from the GitHub UI
  workflow_dispatch:

jobs:
  trigger-netlify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Netlify build
        env:
          # Passed via env (not interpolated into the script) so an unset secret
          # is an empty string we can check, rather than a blank URL curl POSTs to.
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. See the workflow header for setup instructions." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            "$NETLIFY_BUILD_HOOK"

      # This doesn't confirm the triggered build has finished or succeeded —
      # just where it will land once it does.
      - name: Print site URL
        run: |
          echo "Netlify production rebuild triggered." >> "$GITHUB_STEP_SUMMARY"
          echo "Site (once the build finishes): https://kieranpotts.com" >> "$GITHUB_STEP_SUMMARY"
