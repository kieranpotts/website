#
# Files listed here are published to the site root rather than under the UI
# output prefix (`_/`). The Netlify control files (_redirects, _headers) MUST
# be at the publish root to take effect; robots.txt and favicon.ico are
# conventionally served from the root too.
#
static_files:
- _redirects
- _headers
- robots.txt
- favicon.ico
# Blog feeds are served at /feeds/ (their long-standing location, which existing
# subscribers' readers poll). Sourced from the blog repo (src/feeds/).
- feeds/rss.xml
- feeds/atom.xml
- feeds/feed.json
