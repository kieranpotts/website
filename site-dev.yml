site:
  title: Kieran Potts
  url: http://localhost:8080
  start_page: ROOT::index.adoc

content:
  sources:
  # This repo is checked out as a git worktree, so its working-tree `.git` is a
  # pointer file, not a directory. Antora (via isomorphic-git) only recognises a
  # local source whose `.git` is a real directory, so it cannot read the
  # worktree directly. Instead we point at the sibling bare repo and its
  # `latest/dev` branch — the same mechanism used for the remote sources below.
  #
  # CONSEQUENCE: local builds reflect only *committed* content on `latest/dev`.
  # Uncommitted edits to the home/about pages under src/ will NOT appear until
  # they are committed. (The container mounts the parent dir so `../.bare` is
  # reachable inside it; see docker-compose.yml.)
  - url: ../.bare
    branches: latest/dev
    start_path: src/content

  # blog/garden/bookmarks are submodules, so they cannot be read as local
  # content sources (Antora rejects a submodule .git pointer file). They are
  # referenced by their (public) remote URL instead. The playbook reads the
  # pushed branch, so changes in those repos must be pushed before they appear
  # here.
  - url: 'https://github.com/kieranpotts/thoughts.git'
    branches: latest/dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/thoughts/edit/latest/dev/{path}'

  - url: 'https://github.com/kieranpotts/garden.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/garden/edit/dev/{path}'

  - url: 'https://github.com/kieranpotts/bookmarks.git'
    branches: dev
    start_path: src
    edit_url: 'https://github.com/kieranpotts/bookmarks/edit/dev/{path}'

ui:
  # The custom theme is published as a release asset of the website-ui repo and
  # pinned by version here. Theme iteration happens in website-ui's own preview
  # (`npm run preview`); a new version is cut by tagging website-ui, after which
  # this URL is bumped. Keep this in sync with site-ci.yml.
  bundle:
    url: https://github.com/kieranpotts/website-ui/releases/download/v0.5.0/ui-bundle.zip
    snapshot: true
  # src/static supplies the site's static control files (_redirects, _headers,
  # robots.txt, favicon.ico), the blog feeds, and the site-specific partial
  # overrides (head, nav-menu) that layer over the theme. See src/static/ui.yml.
  supplemental_files: src/static

output:
  clean: true
  dir: public
